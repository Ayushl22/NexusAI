services:

  backend:
    build:
      context: ./backend
    container_name: nexusai-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: nexusai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped